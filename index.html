<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zu Writer</title>
<meta name="description" content="Write text in the Zu alphabet from FEZ.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 5 5%22><rect width=%225%22 height=%225%22 fill=%22%23F4C542%22/></svg>">
<link rel="preload" href="fonts/fez-alphabet.otf" as="font" type="font/otf" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1 aria-label="Zu writer">ZU WRITER</h1>
    <p class="sub">Zu writer <span>— write in the alphabet of FEZ</span></p>
  </header>

  <div class="layout">
    <main>
      <div class="panel stage-box">
        <div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Your text rendered in the Zu alphabet"></canvas></div>
        <p class="hint" id="hint"></p>
      </div>

      <div class="panel editor">
        <div class="top">
          <span>Text boxes</span>
          <label class="check"><input type="checkbox" id="zuInput"> Show what I type as glyphs</label>
        </div>
        <div class="boxes" id="boxes"></div>
        <div class="add-row"><button class="act" id="addBox" type="button">Add text box</button></div>
        <div class="keys" id="keys" aria-label="Glyph keyboard"></div>
      </div>
    </main>

    <aside class="panel controls">
      <fieldset class="full">
        <legend>Writing style</legend>
        <div class="seg" id="modes">
          <label><input type="radio" name="mode" value="columns" checked><span><span class="t">Hexahedron columns</span><span class="d">Top to bottom, columns right to left, glyphs upright</span></span></label>
          <label><input type="radio" name="mode" value="pillar"><span><span class="t">Hieroglyph pillar</span><span class="d">The whole message turned 90°, glyphs included</span></span></label>
          <label><input type="radio" name="mode" value="rows"><span><span class="t">Plain rows</span><span class="d">Left to right, easiest to check your spelling</span></span></label>
        </div>
      </fieldset>

      <fieldset class="full">
        <legend>Surface</legend>
        <div class="seg" id="surfaces">
          <label><input type="radio" name="surf" value="speech" checked><span class="swatch" style="background:#000"></span><span><span class="t">Speech box</span><span class="d">White on black, like dialogue</span></span></label>
          <label><input type="radio" name="surf" value="pillar"><span class="swatch" style="background:#6E4B8C"></span><span><span class="t">Purple stone</span><span class="d">Carved into a pillar</span></span></label>
          <label><input type="radio" name="surf" value="wall"><span class="swatch" style="background:#C9A77A"></span><span><span class="t">Village wall</span><span class="d">Painted on bricks</span></span></label>
          <label><input type="radio" name="surf" value="paper"><span class="swatch" style="background:#EAD9A8"></span><span><span class="t">Old paper</span><span class="d">Inked like a found note</span></span></label>
        </div>
      </fieldset>

      <div>
        <label class="lab" for="len" id="lenLabel">Glyphs per column</label>
        <div class="range-row"><input type="range" id="len" min="3" max="32" value="10"><output id="lenOut">10</output></div>
      </div>
      <div>
        <label class="lab" for="size">Glyph size</label>
        <div class="range-row"><input type="range" id="size" min="2" max="12" value="5"><output id="sizeOut">5</output></div>
      </div>
      <div class="full">
        <label class="check"><input type="checkbox" id="gap" checked> Leave a blank square between words</label>
      </div>

      <fieldset class="full anim">
        <legend>Writing animation</legend>
        <div class="stack">
          <div>
            <label class="lab" for="speed">Time per letter</label>
            <div class="range-row"><input type="range" id="speed" min="0.02" max="0.3" step="0.01" value="0.1"><output id="speedOut">0.10 s</output></div>
            <button class="link" id="speedReset" type="button">Use Hexahedron speed (0.10 s)</button>
          </div>
          <div>
            <label class="lab" for="hold">Pause before next box</label>
            <div class="range-row"><input type="range" id="hold" min="0.3" max="5" step="0.1" value="1.5"><output id="holdOut">1.5 s</output></div>
          </div>
          <div>
            <span class="lab" id="bgLabel">Background behind the box</span>
            <div class="chips" role="radiogroup" aria-labelledby="bgLabel">
              <label><input type="radio" name="bg" value="sky" checked><span>Sky</span></label>
              <label><input type="radio" name="bg" value="green"><span>Green screen</span></label>
              <label><input type="radio" name="bg" value="black"><span>Black</span></label>
            </div>
          </div>
          <div>
            <span class="lab" id="scaleLabel">Export size</span>
            <div class="chips" role="radiogroup" aria-labelledby="scaleLabel">
              <label><input type="radio" name="scale" value="1"><span>1×</span></label>
              <label><input type="radio" name="scale" value="2" checked><span>2×</span></label>
              <label><input type="radio" name="scale" value="3"><span>3×</span></label>
              <label><input type="radio" name="scale" value="4"><span>4×</span></label>
            </div>
          </div>
        </div>
      </fieldset>

      <div class="full">
        <button class="act primary wide" id="play" type="button">Play all boxes</button>
        <div class="btns">
          <button class="act" id="gif" type="button">Download GIF</button>
          <button class="act" id="video" type="button">Download video</button>
        </div>
        <button class="act wide" id="save" type="button">Save selected box as PNG</button>
        <p class="status" id="status" aria-live="polite"></p>
      </div>
    </aside>
  </div>
</div>
<div class="tip" id="tip"></div>
<script src="js/vendor/mp4-muxer.js"></script>
<script src="js/save.js"></script>
<script src="js/app.js"></script>
</body>
</html>
